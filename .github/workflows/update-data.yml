name: Update Data Gempa Harian

on:
  schedule:
    - cron: '0 0,12 * * *' # Jalan tiap 00:00 dan 12:00 UTC
  workflow_dispatch: # Tombol run manual di GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib seaborn

      - name: Tarik data & buat visualisasi
        run: python analyze.py

      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ output/ README.md
          if git diff --staged --quiet; then
            echo "Tidak ada data baru."
          else
            git commit -m "auto: update data gempa BMKG terkini"
            git push
          fi
